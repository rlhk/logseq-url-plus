name: Test

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here needs write access.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # shadow-cljs bundles a Closure Compiler built for class-file version 65,
      # so anything below JDK 21 fails with UnsupportedClassVersionError.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Prepare Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          bb: latest
          clj-kondo: latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: bb lint

      # daisyUI renames classes between majors and a dropped class fails
      # silently - the markup renders, just unstyled.
      - name: Check UI classes
        run: bb check-css

      - name: Test
        run: bb test
