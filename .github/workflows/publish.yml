name: Build Logseq Plugin URL+
run-name: ${{ github.actor }} is running GitHub Actions for Logseq Plugin URL+
env:
  PLUGIN_NAME: logseq-url-plus
on:
  push:
    tags:
      - "*.*.*"

# Required by the release step; nothing else needs write access.
permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare NodeJS
        uses: actions/setup-node@v4
        with:
          # Node 18 went end-of-life in April 2025.
          node-version: '22'
          cache: 'yarn'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Prepare Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.2
        with: 
          bb: latest
          clj-kondo: latest
      - name: Build Code
        run: |
          yarn install --frozen-lockfile
          bb lint
          bb test
          bb build
          mkdir ${{ env.PLUGIN_NAME }}
          # Documentation images are referenced from raw.githubusercontent.com,
          # so they no longer need to ship inside the plugin zip.
          cp package.json README.md ${{ env.PLUGIN_NAME }}
          mv dist ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}
          ls
      # A single action creates the release and uploads its assets; previously
      # ncipollo/release-action and softprops/action-gh-release both ran.
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          files: |
            package.json
            ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip